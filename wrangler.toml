name = "twitter-movie-downloader"
main = "packages/api/worker.ts"
compatibility_date = "2024-08-01"
account_id = "79ece236c4bc33a318184e6f375ccdb7"

[alias]
"@tmd/shared" = "./packages/shared/worker.ts"

[assets]
directory = "packages/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api", "/api/*"]

# カスタムドメイン（同一 Cloudflare アカウント上の tokaga.me）
[[routes]]
pattern = "tokaga.me/twitter-movie-downloader/*"
zone_name = "tokaga.me"

# Web UI は /twitter-movie-downloader/ 配下だが API は同一オリジンの /api/* を呼ぶ
[[routes]]
pattern = "tokaga.me/api/*"
zone_name = "tokaga.me"
