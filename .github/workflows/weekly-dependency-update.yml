name: Weekly dependency update

on:
  schedule:
    # Monday 00:00 UTC (Monday 09:00 JST)
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-dependency-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update dependencies to latest
        run: bun update --latest --recursive

      - name: Detect dependency changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates available."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency updates detected."
            git --no-pager diff --stat
          fi

      - name: Formatter
        if: steps.changes.outputs.changed == 'true'
        run: bun run format:check

      - name: Linter
        if: steps.changes.outputs.changed == 'true'
        run: bun run lint

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: bun test

      # Browser e2e は未整備のため、本番相当の Cloudflare 向けビルドをゲートにする
      - name: E2E
        if: steps.changes.outputs.changed == 'true'
        run: bun run test:e2e

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/weekly-dependency-update
          delete-branch: true
          title: "chore: weekly dependency update"
          commit-message: "chore: weekly dependency update"
          body: |
            ## Summary
            - 週次ジョブで `bun update --latest --recursive` を実行した依存関係更新です。
            - PR 作成前に formatter / linter / test / e2e（本番ビルド）が成功しています。

            ## Test plan
            - [x] `bun run format:check`
            - [x] `bun run lint`
            - [x] `bun test`
            - [x] `bun run test:e2e`
